<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>음악 자막 영상 만들기</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main>
      <header><h1>음악 자막 영상</h1><p>음악을 들으며 타이밍을 찍고 바로 렌더하세요.</p></header>
      <section class="media">
        <label>곡 제목<input id="title" type="text" /></label>
        <label>아티스트<input id="artist" type="text" /></label>
        <label>음악<input id="music" type="file" accept="audio/*" /></label>
        <label>배경 이미지<input id="cover" type="file" accept="image/*" /></label>
        <img id="coverPreview" src="/media/cover" alt="배경 이미지 미리보기" />
        <audio id="audio" src="/media/music" preload="metadata"></audio>
        <div class="timeline">
          <button id="play" type="button">재생</button>
          <input id="scrubber" type="range" min="0" max="0" step="0.01" value="0" aria-label="프리뷰 타임라인" />
          <output id="timeDisplay">0.00 / 0.00초</output>
          <label class="volume">음량<input id="volume" type="range" min="0" max="1" step="0.01" value="1" /><output id="volumeDisplay">100%</output></label>
        </div>
      </section>
      <section>
        <div class="toolbar">
          <h2>SRT 자막</h2>
          <label class="srt-import">SRT 불러오기<input id="srtFile" type="file" accept=".srt,application/x-subrip,text/plain" /></label>
          <button id="add" type="button">+ 자막 추가</button>
          <button class="offset" data-offset="-0.1" type="button">전체 -0.1초</button>
          <button class="offset" data-offset="0.1" type="button">전체 +0.1초</button>
          <button id="save" type="button">SRT 저장</button>
          <button id="download" type="button">SRT 다운로드</button>
        </div>
        <div id="captions"></div>
      </section>
      <section class="finish">
        <button id="chooseOutput" type="button">출력 위치 선택</button>
        <span id="outputName">music-video.mp4</span>
        <button id="render" class="primary" type="button">영상 렌더하기</button>
        <a id="video" href="/video" target="_blank">완성 영상 열기</a>
        <progress id="renderProgress" max="100" value="0"></progress>
        <output id="renderLabel">대기 중</output>
        <output id="status" aria-live="polite"></output>
      </section>
    </main>
    <template id="rowTemplate">
      <div class="caption-row">
        <span class="number"></span>
        <span class="drag-handle" draggable="true" title="드래그하여 순서 변경" aria-label="드래그하여 순서 변경">⋮⋮</span>
        <label>시작(초)<input class="start" type="number" min="0" step="0.001" /></label>
        <button class="mark-start" type="button">현재→시작</button>
        <label>끝(초)<input class="end" type="number" min="0" step="0.001" /></label>
        <button class="mark-end" type="button">현재→끝</button>
        <label class="text">자막<textarea rows="2"></textarea></label>
        <button class="remove danger" type="button" aria-label="자막 삭제">삭제</button>
      </div>
    </template>
    <script type="module" src="/app.js"></script>
  </body>
</html>
